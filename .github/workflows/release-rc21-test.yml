name: Publish DM1701 test firmware
on:
  push:
    branches: [codex/publish-v1.2.0-rc.21-test]
  workflow_dispatch:
defaults:
  run:
    shell: bash
permissions:
  contents: write
concurrency:
  group: public-release-v1.2.0-rc.21-test
  cancel-in-progress: true
jobs:
  publish:
    if: github.event_name == 'workflow_dispatch' || contains(github.event.head_commit.message, '[publish rc21-test]')
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    env:
      GH_TOKEN: ${{ github.token }}
      GH_REPO: ${{ github.repository }}
    steps:
      - uses: actions/checkout@v4
      - run: python3 .github/scripts/publish_rc21_test.py publish 2>&1 | tee publish-rc21-test.log
      - if: always()
        run: python3 .github/scripts/publish_rc21_test.py status
        env:
          JOB_STATUS: ${{ job.status }}
