name: Firmware test / 固件测试反馈
description: Report reproducible behaviour on supported dual-band hardware
title: "[TEST] "
body:
  - type: dropdown
    id: hardware
    attributes:
      label: Hardware profile / 硬件
      options:
        - Ordinary MD-UV380/390 5W + GPS
        - Plus10W PD8 backlight / PC6 PA
        - Plus10W PC6 backlight / PD8 PA
        - Unknown board — identify before flashing
    validations:
      required: true
  - type: input
    id: version
    attributes:
      label: Full ZIP name / 完整包名
    validations:
      required: true
  - type: textarea
    id: reproduce
    attributes:
      label: Mode, steps, expected and actual behaviour / 模式、步骤与结果
    validations:
      required: true
  - type: textarea
    id: evidence
    attributes:
      label: Optional redacted evidence / 可选脱敏证据
      description: Include BER equipment/conditions if relevant. No passwords, donors, merged firmware, private coordinates or others' recordings.
  - type: checkboxes
    id: privacy
    attributes:
      label: Before sharing / 提交前
      options:
        - label: I removed credentials, proprietary codec/donor data and private personal information.
          required: true
